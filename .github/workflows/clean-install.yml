name: Private clean-install and DSH compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: DSH ${{ matrix.dsh }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dsh: [0.2.1-rc.2, 0.2.1-rc.5]
    steps:
      - name: Checkout private candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Strict tracked file SHA-256 manifest
        run: node scripts/verify-release-manifest.mjs
      - name: Fresh npm tarball install and typed tool execution
        run: node scripts/clean-install-smoke.mjs ${{ matrix.dsh }}
