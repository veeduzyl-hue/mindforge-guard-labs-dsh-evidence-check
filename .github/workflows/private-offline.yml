name: Private offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Strict source inventory
        run: node scripts/verify-release-manifest.mjs
      - name: Unit and regression tests
        run: npm test
      - name: Frozen engine integrity
        run: node scripts/verify-engine.mjs
      - name: Synthetic unseen A/B integration
        run: node scripts/integration-preflight.mjs
      - name: Assert release remains blocked
        run: node -e "const {spawnSync}=require('node:child_process'); const r=spawnSync(process.execPath,['scripts/release-check.mjs'],{encoding:'utf8'});const t=(r.stdout||'')+(r.stderr||'');if(r.status!==2||!t.includes('PUBLIC_RELEASE_BLOCKED')){console.error(t);process.exit(1)}console.log('PUBLIC_RELEASE_BLOCKED_CONFIRMED')"
